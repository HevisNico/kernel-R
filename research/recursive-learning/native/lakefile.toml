name = "recursive_learning_native"
version = "0.4.0"
defaultTargets = ["Native", "NativeAudit"]

[[require]]
name = "kernel_r"
path = "../../../proof/lean"

[[require]]
name = "recursive_learning"
path = ".."

# One library per package. Modules live in six folders:
# Teaching, Thresholds, Coincidence, Training, Network and Search.
[[lean_lib]]
name = "Native"
globs = ["Teaching.+", "Thresholds.+", "Coincidence.+", "Training.+", "Network.+", "Search.+"]

[[lean_lib]]
name = "NativeAudit"
