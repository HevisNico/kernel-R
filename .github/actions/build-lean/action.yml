name: Build Lean package
description: Install the verified Lean distribution and build the pinned Lake package.
inputs:
  package-directory:
    description: Path to the Lake package, relative to the repository root.
    required: true
  mathlib-cache-targets:
    description: Space-separated Mathlib modules to cache. Empty fetches the full cache.
    default: ''
runs:
  using: composite
  steps:
    - name: Install the pinned Lean distribution
      shell: bash
      working-directory: ${{ inputs.package-directory }}
      run: |
        set -euo pipefail
        # Both callers use x64 Linux GitHub-hosted runners.
        toolchain=$(cat lean-toolchain)
        if [[ "$toolchain" != "leanprover/lean4:v4.35.0" ]]; then
          printf 'Update the CI asset ID and digest for toolchain %s\n' "$toolchain" >&2
          exit 1
        fi
        archive=$(mktemp "$RUNNER_TEMP/lean.XXXXXXXX.tar.zst")
        trap 'rm -f "$archive"' EXIT
        install_dir=$(mktemp -d "$RUNNER_TEMP/lean.XXXXXXXX")
        download_toolchain() {
          curl --fail --silent --show-error --location \
            --retry 2 --retry-all-errors --retry-max-time 180 \
            --connect-timeout 10 --max-time 180 --output "$archive" "$@" &&
          printf '%s  %s\n' '7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d' "$archive" \
            | sha256sum --check
        }
        # The release asset API and the browser URL take different download routes.
        download_toolchain -H 'Accept: application/octet-stream' \
          "https://api.github.com/repos/leanprover/lean4/releases/assets/634574462?download=1&run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" ||
        download_toolchain \
          "https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        tar --no-same-owner --strip-components=1 --zstd -xf "$archive" -C "$install_dir"
        "$install_dir/bin/lean" --version
        "$install_dir/bin/lake" --version
        printf '%s\n' "$install_dir/bin" >> "$GITHUB_PATH"

    - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      id: cache-restore
      with:
        path: ${{ inputs.package-directory }}/.lake
        key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/lean-toolchain', inputs.package-directory)) }}-${{ hashFiles(format('{0}/lake-manifest.json', inputs.package-directory)) }}-${{ github.sha }}
        restore-keys: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/lean-toolchain', inputs.package-directory)) }}-${{ hashFiles(format('{0}/lake-manifest.json', inputs.package-directory)) }}-

    - name: Get Mathlib cache and build
      shell: bash
      working-directory: ${{ inputs.package-directory }}
      env:
        MATHLIB_CACHE_TARGETS: ${{ inputs.mathlib-cache-targets }}
      run: |
        set -euo pipefail
        read -r -a targets <<< "$MATHLIB_CACHE_TARGETS"
        if ((${#targets[@]} == 0)); then
          export MATHLIB_CACHE_GET_URL="${MATHLIB_CACHE_GET_URL-https://cache.mathlib.org/mathlib4}"
          if [[ -z "$MATHLIB_CACHE_GET_URL" ]]; then
            unset MATHLIB_CACHE_GET_URL
          fi
        fi
        lake exe cache get "${targets[@]}"
        lake build

    - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      if: steps.cache-restore.outputs.cache-hit != 'true'
      with:
        path: ${{ inputs.package-directory }}/.lake
        key: ${{ steps.cache-restore.outputs.cache-primary-key }}
