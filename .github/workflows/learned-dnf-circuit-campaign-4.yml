name: Learned DNF circuit campaign 4

on:
  push:
    branches:
      - research/learned-dnf-circuit-campaign-4
      - research/learned-dnf-circuit-campaign-4-wip
    paths:
      - research/learned-dnf-circuit-campaign-4/**
      - research/learned-dnf-circuit/**
      - research/learned-coincidence/**
      - .github/workflows/learned-dnf-circuit-campaign-4.yml
  pull_request:
    paths:
      - research/learned-dnf-circuit-campaign-4/**
      - research/learned-dnf-circuit/**
      - research/learned-coincidence/**
      - .github/workflows/learned-dnf-circuit-campaign-4.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # amendment 8: on a runner without AVX-512, check.sh compares the generated JSON files structurally; it states the
      # CPU, the OpenBLAS core and the comparison it made
      C4_CI_STRUCTURAL: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Python 3.12.3 with numpy 2.3.5 (amendment 3, section 3)
        run: |
          set -euo pipefail
          /usr/bin/python3.12 -m venv "$RUNNER_TEMP/python"
          "$RUNNER_TEMP/python/bin/python" -m pip install numpy==2.3.5
          cd research/learned-dnf-circuit-campaign-4
          "$RUNNER_TEMP/python/bin/python" -B -c 'import c4; print(c4.require_pinned())'
      - name: Checks of the implementation against PREDICTION.md and the amendments, without simulation
        run: cd research/learned-dnf-circuit-campaign-4 && "$RUNNER_TEMP/python/bin/python" -B -m unittest -v test_campaign
      - name: Install the pinned Lean distribution
        run: |
          set -euo pipefail
          test "$(cat proof/lean/lean-toolchain)" = 'leanprover/lean4:v4.35.0'
          archive=$(mktemp "$RUNNER_TEMP/lean.XXXXXXXX.tar.zst")
          install_dir=$(mktemp -d "$RUNNER_TEMP/lean.XXXXXXXX")
          download_toolchain() {
            curl --fail --silent --show-error --location \
              --retry 2 --retry-all-errors --retry-max-time 180 \
              --connect-timeout 10 --max-time 180 --output "$archive" "$@" &&
            printf '%s  %s\n' '7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d' "$archive" \
              | sha256sum --check
          }
          download_toolchain -H 'Accept: application/octet-stream' \
            "https://api.github.com/repos/leanprover/lean4/releases/assets/634574462?download=1&run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" ||
          download_toolchain \
            "https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          tar --no-same-owner --strip-components=1 --zstd -xf "$archive" -C "$install_dir"
          rm -f "$archive"
          printf '%s\n' "$install_dir/bin" >> "$GITHUB_PATH"
      - name: The waveform of the rehearsal's run without noise (attempt 2), from its evidence branch, for M8's eligible path
        run: |
          set -euo pipefail
          run=research/learned-dnf-circuit-campaign-4/rehearsal/run-2/collected-N-a/a-None-quiet
          git init -q "$RUNNER_TEMP/evidence"
          git -C "$RUNNER_TEMP/evidence" fetch -q --depth 1 --filter=blob:none "https://github.com/$GITHUB_REPOSITORY" \
            evidence/learned-dnf-circuit-campaign-4-rehearsal-run-2
          git -C "$RUNNER_TEMP/evidence" checkout -q FETCH_HEAD -- "$run/evidence/trace.raw"
          cp "$RUNNER_TEMP/evidence/$run/evidence/trace.raw" "$run/evidence/trace.raw"
      - name: M8's eligible path (amendment 8), code path only, P0's prediction with that run
        run: |
          cd research/learned-dnf-circuit-campaign-4
          "$RUNNER_TEMP/python/bin/python" -B m8_case.py rehearsal/run-2/collected-N-a/a-None-quiet "$RUNNER_TEMP/M8_eligible.lean"
      - name: The kernel gate on P0 to P6 and P4', its targets and the mirror mutations, regenerated and audited; M8 eligible, and M8 with no eligible instance (a theorem on no axiom)
        run: |
          PYTHON="$RUNNER_TEMP/python/bin/python" bash research/learned-dnf-circuit-campaign-4/check.sh \
            "$RUNNER_TEMP/M8_eligible.lean" "$PWD/research/learned-dnf-circuit-campaign-4/rehearsal/run-2/analysis/M8.lean"
      - name: The negative cases of the audit (amendment 8), each refused on the check of the axioms
        run: PYTHON="$RUNNER_TEMP/python/bin/python" bash research/learned-dnf-circuit-campaign-4/audit_cases.sh
