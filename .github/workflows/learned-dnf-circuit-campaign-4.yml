name: Learned DNF circuit campaign 4

on:
  push:
    branches:
      - research/learned-dnf-circuit-campaign-4
      - research/learned-dnf-circuit-campaign-4-wip
    paths:
      - research/learned-dnf-circuit-campaign-4/**
      - research/learned-dnf-circuit/**
      - research/learned-coincidence/**
      - .github/workflows/learned-dnf-circuit-campaign-4.yml
  pull_request:
    paths:
      - research/learned-dnf-circuit-campaign-4/**
      - research/learned-dnf-circuit/**
      - research/learned-coincidence/**
      - .github/workflows/learned-dnf-circuit-campaign-4.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Python 3.12.3 with numpy 2.3.5 (amendment 3, section 3)
        run: |
          set -euo pipefail
          /usr/bin/python3.12 -m venv "$RUNNER_TEMP/python"
          "$RUNNER_TEMP/python/bin/python" -m pip install numpy==2.3.5
          cd research/learned-dnf-circuit-campaign-4
          "$RUNNER_TEMP/python/bin/python" -B -c 'import c4; print(c4.require_pinned())'
      - name: Checks of the implementation against PREDICTION.md and the amendments, without simulation
        run: cd research/learned-dnf-circuit-campaign-4 && "$RUNNER_TEMP/python/bin/python" -B -m unittest -v test_campaign
      - name: Install the pinned Lean distribution
        run: |
          set -euo pipefail
          test "$(cat proof/lean/lean-toolchain)" = 'leanprover/lean4:v4.35.0'
          archive=$(mktemp "$RUNNER_TEMP/lean.XXXXXXXX.tar.zst")
          install_dir=$(mktemp -d "$RUNNER_TEMP/lean.XXXXXXXX")
          download_toolchain() {
            curl --fail --silent --show-error --location \
              --retry 2 --retry-all-errors --retry-max-time 180 \
              --connect-timeout 10 --max-time 180 --output "$archive" "$@" &&
            printf '%s  %s\n' '7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d' "$archive" \
              | sha256sum --check
          }
          download_toolchain -H 'Accept: application/octet-stream' \
            "https://api.github.com/repos/leanprover/lean4/releases/assets/634574462?download=1&run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" ||
          download_toolchain \
            "https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          tar --no-same-owner --strip-components=1 --zstd -xf "$archive" -C "$install_dir"
          rm -f "$archive"
          printf '%s\n' "$install_dir/bin" >> "$GITHUB_PATH"
      - name: The kernel gate on P0 to P6 and P4', its targets and the mirror mutations, regenerated and audited
        run: PYTHON="$RUNNER_TEMP/python/bin/python" bash research/learned-dnf-circuit-campaign-4/check.sh
