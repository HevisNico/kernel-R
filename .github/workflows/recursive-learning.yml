name: Recursive learning Lean proofs

on:
  push:
    branches: [main]
    paths:
      - research/recursive-learning/**
      - research/reusable-controller/verify_native_return.py
      - research/reusable-controller/verify_native_reprepare.py
      - proof/lean/**
      - .github/workflows/recursive-learning.yml
      - .github/actions/build-lean/**
  pull_request:
    paths:
      - research/recursive-learning/**
      - research/reusable-controller/verify_native_return.py
      - research/reusable-controller/verify_native_reprepare.py
      - proof/lean/**
      - .github/workflows/recursive-learning.yml
      - .github/actions/build-lean/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/build-lean
        with:
          package-directory: research/recursive-learning/native
          mathlib-cache-targets: >-
            Mathlib.Tactic
            Mathlib.Analysis.Calculus.MeanValue
            Mathlib.Analysis.Complex.ExponentialBounds
            Mathlib.Analysis.SpecialFunctions.ExpDeriv
            Mathlib.Analysis.SpecialFunctions.Log.Basic
            Mathlib.Data.List.OfFn
            Mathlib.Data.List.Sort
            Mathlib.MeasureTheory.Integral.IntervalIntegral.Basic
            Mathlib.MeasureTheory.Integral.IntervalIntegral.FundThmCalculus
      - name: Reject native read-to-rest semantic mutations
        run: python -B research/reusable-controller/verify_native_return.py --report "$RUNNER_TEMP/native-return-validation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-return-validation
          path: ${{ runner.temp }}/native-return-validation.json
          if-no-files-found: error
      - name: Reject native re-preparation semantic mutations
        run: python -B research/reusable-controller/verify_native_reprepare.py --report "$RUNNER_TEMP/native-reprepare-validation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-reprepare-validation
          path: ${{ runner.temp }}/native-reprepare-validation.json
          if-no-files-found: error
