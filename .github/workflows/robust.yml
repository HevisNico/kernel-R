name: Robust birth and latency evidence

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  robust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research/robust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Regression tests
        run: |
          python -B tests.py
          python -B test_regressions.py
          python -B test_campaign_io.py
          python -B periodic/tests.py
          python -B birth/tests.py
          python -B latency/tests.py
      - name: Range certificates (every nu and alpha in the certified ranges)
        run: |
          python -B ranges/tests.py
          for c in ranges/certificates/*.json; do python -B ranges/verify.py "$c"; done
      - name: Replay all robust birth and latency certificates
        working-directory: proof/lean
        run: python -B -m scripts.evidence.robust_evidence --check
