name: SKY130 qualification and owner launch kit

on:
  pull_request:
    paths:
      - research/sky130-supervisor-qualification/**
      - research/sky130-supervisor-map/probe.py
      - research/circuit/**
      - .github/workflows/sky130-supervisor-qualification.yml
  push:
    branches: [main]
    paths:
      - research/sky130-supervisor-qualification/**
      - .github/workflows/sky130-supervisor-qualification.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install numpy==2.3.5
      - name: Install the pinned Lean distribution
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat research/sky130-supervisor-qualification/lean/lean-toolchain)" = 'leanprover/lean4:v4.35.0'
          archive=$(mktemp "$RUNNER_TEMP/lean.XXXXXXXX.tar.zst")
          install_dir=$(mktemp -d "$RUNNER_TEMP/lean.XXXXXXXX")
          trap 'rm -f "$archive"' EXIT
          download_toolchain() {
            curl --fail --silent --show-error --location \
              --retry 2 --retry-all-errors --retry-max-time 180 \
              --connect-timeout 10 --max-time 180 --output "$archive" "$@" &&
            printf '%s  %s\n' '7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d' "$archive" \
              | sha256sum --check
          }
          download_toolchain -H 'Accept: application/octet-stream' \
            "https://api.github.com/repos/leanprover/lean4/releases/assets/634574462?download=1&run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" ||
          download_toolchain \
            "https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          tar --no-same-owner --strip-components=1 --zstd -xf "$archive" -C "$install_dir"
          "$install_dir/bin/lean" --version
          printf '%s\n' "$install_dir/bin" >> "$GITHUB_PATH"
      - name: Check conditional proofs, direct mutations and owner-kit controls
        run: python3 -B research/sky130-supervisor-qualification/verify.py
      - name: Confirm historical evidence is unchanged
        run: git diff --exit-code
