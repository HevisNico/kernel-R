name: Rest tolerance

on:
  push:
    branches: [main]
    paths:
      - research/rest-tolerance/**
      - research/recursive-learning/**
      - proof/lean/**
      - .github/actions/build-lean/**
      - .github/workflows/rest-tolerance.yml
  pull_request:
    paths:
      - research/rest-tolerance/**
      - research/recursive-learning/**
      - proof/lean/**
      - .github/actions/build-lean/**
      - .github/workflows/rest-tolerance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rest-tolerance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/build-lean
        with:
          package-directory: research/rest-tolerance
          mathlib-cache-targets: >-
            Mathlib.Tactic
            Mathlib.Analysis.Calculus.MeanValue
            Mathlib.Analysis.Complex.ExponentialBounds
            Mathlib.Analysis.SpecialFunctions.ExpDeriv
            Mathlib.Analysis.SpecialFunctions.Log.Basic
            Mathlib.Analysis.SpecialFunctions.Log.Deriv
            Mathlib.Data.List.OfFn
            Mathlib.Data.List.Sort
            Mathlib.MeasureTheory.Integral.IntervalIntegral.Basic
            Mathlib.MeasureTheory.Integral.IntervalIntegral.FundThmCalculus
      - name: Test certification and reject semantic mutations
        working-directory: research/rest-tolerance
        run: |
          python -B -m unittest -v
          python -B check_mutations.py
