name: Kernel R Lean proofs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source identities and generated evidence
        working-directory: proof/lean
        run: |
          python scripts/check_sources.py
          python scripts/generate_evidence.py --check
          python scripts/robust_evidence.py --check
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proof/lean
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Audit every KernelR and A22 theorem
        working-directory: proof/lean
        run: lake build Audit
      - name: Reject axioms in current and imported project declarations
        working-directory: proof/lean
        run: python scripts/check_audit_negative.py
      - name: Reject corrupted endpoints, cadence dose counters and adaptive scores
        working-directory: proof/lean
        run: python scripts/check_negative.py
      - name: Reject invalid physical transitions and doses
        working-directory: proof/lean
        run: python scripts/check_hybrid_negative.py
      - name: Reject altered physical durations, reserve bounds and raw tails
        working-directory: proof/lean
        run: python scripts/check_hybrid_analytic_negative.py
      - name: Reject altered physical event budgets and delivery chronology
        working-directory: proof/lean
        run: python scripts/check_hybrid_event_negative.py
      - name: Reject altered sensor phases, clipped doses and input provenance
        working-directory: proof/lean
        run: python scripts/check_hybrid_phase_negative.py
      - name: Reject altered physical pulse chronology, total doses and source exhaustion
        working-directory: proof/lean
        run: python scripts/check_hybrid_pulse_negative.py
      - name: Reject altered READY returns, memory gates and initial-charge equations
        working-directory: proof/lean
        run: python scripts/check_hybrid_return_negative.py
      - name: Reject altered training gain, silent-dose and charge-return contracts
        working-directory: proof/lean
        run: python scripts/check_hybrid_training_negative.py
      - name: Reject altered low-recovery firing and premature MARK exposure
        working-directory: proof/lean
        run: python scripts/check_hybrid_bootstrap_negative.py
      - name: Reject altered protected MARK doses, outputs and prepared return
        working-directory: proof/lean
        run: python scripts/check_hybrid_protected_negative.py
      - name: Reject altered source chronology, physical warmup and birth preparation
        working-directory: proof/lean
        run: python scripts/check_hybrid_source_negative.py
      - name: Reject lost multicell traffic and weakened variable-gap pulse contracts
        working-directory: proof/lean
        run: python scripts/check_hybrid_cell_negative.py
      - name: Reject altered prepared cases from current physical invariants
        working-directory: proof/lean
        run: python scripts/check_hybrid_local_negative.py
      - name: Reject altered current-state reserve and positive ERROR/MARK doses
        working-directory: proof/lean
        run: python scripts/check_hybrid_invariant_negative.py
      - name: Reject staged-birth resets, source loss and inherited learning
        working-directory: proof/lean
        run: python scripts/check_hybrid_staged_negative.py
      - name: Reject lost cut events, future tokens and altered preparation at birth
        working-directory: proof/lean
        run: python scripts/check_hybrid_boundary_negative.py
      - name: Reject altered physical latency roots and unsupported common calendars
        working-directory: proof/lean
        run: python scripts/check_hybrid_calendar_negative.py
      - name: Reject lost routed inputs, future sources, incorrect contacts and erased jitter
        working-directory: proof/lean
        run: python scripts/check_hybrid_routed_negative.py
      - name: Reject altered staged teaching counts, birth memories and contact guards
        working-directory: proof/lean
        run: python scripts/check_hybrid_teaching_negative.py
      - name: Reject altered reciprocal counts, erased residuals and lost future queues
        working-directory: proof/lean
        run: python scripts/check_hybrid_reciprocal_negative.py
      - name: Reject altered C births, teaching counts, inherited memories and lost sources
        working-directory: proof/lean
        run: python scripts/check_hybrid_c_introduction_negative.py
      - name: Reject altered physical cadence initiation, mixed doses and residual tails
        working-directory: proof/lean
        run: python scripts/check_hybrid_cadence_negative.py
      - name: Reject altered complete physical cascade, birth memories and terminal queues
        working-directory: proof/lean
        run: python scripts/check_hybrid_cascade_negative.py
      - name: Reject altered constructive source existence and first MARK
        working-directory: proof/lean
        run: python scripts/check_hybrid_existence_negative.py
      - name: Reject altered constructed weak cycles and ERROR restarts
        working-directory: proof/lean
        run: python scripts/check_hybrid_weak_existence_negative.py
      - name: Reject altered actual weak-source iteration and first firing
        working-directory: proof/lean
        run: python scripts/check_hybrid_first_fire_negative.py
      - name: Reject altered constructed FAST/SLOW return and protected MARK
        working-directory: proof/lean
        run: python scripts/check_hybrid_protected_mark_negative.py
      - name: Reject altered constructed protected return and sixth source
        working-directory: proof/lean
        run: python scripts/check_hybrid_prepared40_negative.py
      - name: Reject altered constructed first-train preparation and learned iteration
        working-directory: proof/lean
        run: python scripts/check_hybrid_preparation_existence_negative.py
      - name: Reject altered real B birth and independent cell-flow transport
        working-directory: proof/lean
        run: python scripts/check_hybrid_b_birth_product_negative.py
      - name: Reject altered issued-wire existence and joint execution products
        working-directory: proof/lean
        run: python scripts/check_hybrid_first_wire_negative.py
      - name: Reject altered actual interleaved newborn learning and next source
        working-directory: proof/lean
        run: python scripts/check_hybrid_first_interleaved_negative.py
      - name: Reject altered second actual wire and derived receiver calendar
        working-directory: proof/lean
        run: python scripts/check_hybrid_second_wire_negative.py
      - name: Reject altered first B output, FAST exit and exact birth trace
        working-directory: proof/lean
        run: python scripts/check_hybrid_receiver_fire_negative.py
      - name: Reject altered third contact, protected B preparation and coupled section
        working-directory: proof/lean
        run: python scripts/check_hybrid_coupled_preparation_negative.py
      - name: Reject altered constructed coupled train and original-birth teaching counts
        working-directory: proof/lean
        run: python scripts/check_hybrid_coupled_teaching_negative.py
      - name: Reject altered reciprocal weak entry, residual first FIRE and interval products
        working-directory: proof/lean
        run: python scripts/check_hybrid_feedback_entry_negative.py
      - name: Reject altered actual reverse receipt, retained paths and B352 source activation
        working-directory: proof/lean
        run: python scripts/check_hybrid_reverse_receipt_negative.py
      - name: Reject altered constructed reciprocal epoch, own memories and original-birth counts
        working-directory: proof/lean
        run: python scripts/check_hybrid_reverse_epoch_negative.py
      - name: Reject altered actual C birth, protected teaching and original-birth three-cell counts
        working-directory: proof/lean
        run: python scripts/check_hybrid_c_teaching_existence_negative.py
      - name: Reject altered cadence residual first FIRE and actual FAST completion
        working-directory: proof/lean
        run: python scripts/check_hybrid_cadence_first_strong_negative.py
      - name: Reject altered actual cadence warmup, first C wire and isolated learned bridge
        working-directory: proof/lean
        run: python scripts/check_hybrid_cadence_first_wire_negative.py
      - name: Reject altered first physical cadence wave, retained paths and original-birth counts
        working-directory: proof/lean
        run: python scripts/check_hybrid_cadence_first_wave_negative.py
