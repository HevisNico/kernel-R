      - name: Reject altered local second strong and mixed cadence sources, RAW and doses
        working-directory: proof/lean
        run: python scripts/check_hybrid_cadence_second_stage_negative.py
      - name: Reject altered constructive high-gain cadence FIRE and protected completion
        working-directory: proof/lean
