name: R research checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Terminal events and complete adaptive provenance
        run: python -B -m unittest discover -s experiments/reciprocal/tests -v
  local-and-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Project layout, source identities and bundled evidence
        run: python -B -m unittest discover -s tests
      - name: Local theorem tests and refusal cases
        run: python -B certify/reciprocal_learning/tests.py
      - name: Birth-to-section and composition tests
        run: python -B certify/reciprocal_entry/tests.py --link-code certify/reciprocal_learning --link-003 results/reciprocal_learning/eps3e-3/certificate.json --link-01 results/reciprocal_learning/eps1e-1/certificate.json
      - name: Replay both published composed certificates
        run: |
          python -B certify/reciprocal_entry/verify.py results/reciprocal_entry/eps3e-3/certificate.json --link-certificate results/reciprocal_learning/eps3e-3/certificate.json --link-code certify/reciprocal_learning
          python -B certify/reciprocal_entry/verify.py results/reciprocal_entry/eps1e-1/certificate.json --link-certificate results/reciprocal_learning/eps1e-1/certificate.json --link-code certify/reciprocal_learning
      - name: Cadence cascade induction and refusal cases
        run: python -B certify/reciprocal_cadence/tests.py
      - name: Replay both published C-to-B-to-A certificates
        run: |
          for box in eps3e-3 eps1e-1; do
            python -B certify/reciprocal_cadence/verify.py \
              results/reciprocal_cadence/$box/certificate.json \
              --entry-certificate results/reciprocal_entry/$box/certificate.json \
              --entry-code certify/reciprocal_entry \
              --local-certificate results/reciprocal_learning/$box/certificate.json \
              --local-code certify/reciprocal_learning
          done
      - name: Uniform N-cell contracts, symbolic induction and refusal cases
        run: python -B certify/reciprocal_composition/tests.py
      - name: Replay uniform N-cell certificates and instantiate a large chain
        run: |
          for box in eps3e-3 eps1e-1; do
            python -B certify/reciprocal_composition/verify.py \
              results/reciprocal_composition/$box/certificate.json \
              --entry-certificate results/reciprocal_entry/$box/certificate.json \
              --entry-code certify/reciprocal_entry \
              --local-certificate results/reciprocal_learning/$box/certificate.json \
              --local-code certify/reciprocal_learning \
              --cells 100000000000000000000
          done
