name: Exploratory economic sweep
on:
  push:
    branches: [main]
    paths: ['research/economic-sweep/**', 'research/boundary-cost-study/**', '.github/workflows/economic-sweep.yml']
  pull_request:
    paths: ['research/economic-sweep/**', 'research/boundary-cost-study/**', '.github/workflows/economic-sweep.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check independent oracle and policy accounting
        run: python3 -B -m unittest discover -s research/economic-sweep -v
      - name: Reproduce exploratory grid
        run: python3 -B research/economic-sweep/sweep.py
      - name: Preserve exact result bytes
        run: git diff --exit-code -- research/economic-sweep/RESULTS.json research/economic-sweep/cells.csv research/economic-sweep/REPORT.md
