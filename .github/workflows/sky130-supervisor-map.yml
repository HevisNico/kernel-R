name: SKY130 supervisor phase-zero map

on:
  pull_request:
    paths:
      - research/sky130-supervisor-map/**
      - research/circuit/**
      - research/adaptive-refresh-experiment/**
      - .github/workflows/sky130-supervisor-map.yml
  push:
    branches: [main]
    paths:
      - research/sky130-supervisor-map/**
      - research/circuit/**
      - research/adaptive-refresh-experiment/**
      - .github/workflows/sky130-supervisor-map.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-zero:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install analysis dependency
        run: python -m pip install numpy==2.3.5
      - name: Check saved summaries, source identities and negative controls
        run: python3 -B research/sky130-supervisor-map/verify.py
      - name: Confirm historical evidence remains unchanged
        run: git diff --exit-code
