<div id="r-reciproque">
  <style>
    #r-reciproque {color:var(--foreground);font-family:inherit;}
    #r-reciproque .r-head {padding-right:90px;margin-bottom:16px;}
    #r-reciproque .r-readout {display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin:16px 0 4px;}
    #r-reciproque .r-legend {display:flex;gap:16px;flex-wrap:wrap;margin:12px 0;}
    #r-reciproque .r-swatch {display:inline-block;width:22px;height:3px;vertical-align:middle;margin-right:6px;background:var(--viz-series-1);}
    #r-reciproque .r-settings {background:var(--viz-series-2);}
    #r-reciproque .r-diagram {display:block;width:100%;overflow:visible;}
    #r-reciproque .r-diagram text {fill:var(--foreground);font-family:inherit;font-size:var(--font-size-base);font-weight:400;}
    #r-reciproque .r-diagram .r-name {font-weight:500;}
    #r-reciproque .r-detail {min-height:2em;margin-top:10px;}
    #r-reciproque .r-footer {margin-top:12px;}
  </style>
  <div class="r-head"><h3>Cells learn from one another</h3><span class="text-small">Recorded R simulation · A, B and C stay active after introduction.</span></div>
  <div class="viz-controls">
    <label class="form-label">Transmission
      <select class="form-select" id="r-mode">
        <option value="complet">Pulses + settings</option>
        <option value="impulsions">Pulses only</option>
        <option value="reglages">Settings only</option>
        <option value="sans_transfert">No exchange</option>
        <option value="sans_retour">Pulses without feedback to parents</option>
        <option value="sans_plasticite">Pulses without learning</option>
      </select>
    </label>
    <label class="form-label">Stage
      <select class="form-select" id="r-phase"></select>
    </label>
  </div>
  <div class="r-readout"><label for="r-time">Time <span id="r-clock" class="tabular-nums"></span></label><span class="text-small" id="r-step"></span></div>
  <input id="r-time" type="range" class="form-range" min="0" value="0" step="1" aria-label="Browse simulation time">
  <div class="viz-row"><button id="r-play" type="button" class="btn btn-primary">Play</button><span class="text-small">Model time units · pulse width 1</span></div>
  <div class="r-legend text-small"><span><span class="r-swatch"></span>Permitted pulses</span><span><span class="r-swatch r-settings"></span>Recent settings copy</span></div>
  <svg id="r-graph" class="r-diagram" role="img" aria-label="Three R cells, their connections and acquired gains"></svg>
  <div id="r-detail" class="r-detail text-small" aria-live="polite"></div>
  <div class="r-footer text-small">g0: local source · g1: teaching input · g2: feedback / new input · b: recovery · E: model reserve</div>
  <script id="r-recordings" type="application/json">__R_DATA__</script>
  <script>
  (() => {
    const root=document.getElementById('r-reciproque');
    const recordings=JSON.parse(root.querySelector('#r-recordings').textContent);
    const mode=root.querySelector('#r-mode'), phase=root.querySelector('#r-phase'), slider=root.querySelector('#r-time');
    const clock=root.querySelector('#r-clock'), step=root.querySelector('#r-step'), graph=root.querySelector('#r-graph');
    const detail=root.querySelector('#r-detail'), play=root.querySelector('#r-play');
    const ns='http://www.w3.org/2000/svg', names=['A','B','C'];
    let index=0,timer=null;
    const elt=(tag,attrs={},content)=>{const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,String(v)));if(content!==undefined)e.textContent=content;return e;};
    const phases=recordings.phases;
    phases.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=p[2];phase.appendChild(o);});
    function stop(){if(timer!==null)clearInterval(timer);timer=null;play.textContent='Play';detail.setAttribute('aria-live','polite');}
    function setTime(time){const a=recordings.runs[mode.value].samples;index=a.reduce((best,s,i)=>Math.abs(s[0]-time)<Math.abs(a[best][0]-time)?i:best,0);slider.value=index;draw();}
    function draw(){
      const run=recordings.runs[mode.value],row=run.samples[index],t=row[0];
      slider.max=run.samples.length-1;slider.value=index;clock.textContent=t.toFixed(1);
      const pi=Math.max(0,phases.findIndex(p=>p[0]<=t&&t<p[1]));phase.value=t>=1000?5:pi;
      step.textContent=phases[t>=1000?5:pi][2];
      const w=Math.max(280,root.clientWidth),vertical=w<570,h=vertical?760:285;
      graph.setAttribute('viewBox',`0 0 ${w} ${h}`);graph.replaceChildren();
      graph.appendChild(elt('title',{},'Gains, recovery and connections at time '+t.toFixed(1)));
      const defs=elt('defs');const marker=elt('marker',{id:'r-arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});
      marker.appendChild(elt('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'context-stroke'}));defs.appendChild(marker);graph.appendChild(defs);
      const pos=names.map((_,i)=>vertical?[w/2,70+i*250]:[w*(i+.5)/3,65]);
      const cells=names.map((name,i)=>{const p=1+i*7;return {name,g:row.slice(p,p+3),b:row[p+3],E:row[p+4],mode:row[p+5],alive:!!row[p+6]};});
      const cfg=recordings.configs[mode.value];
      recordings.edges.forEach(edge=>{
        const active=cfg.pulses&&(cfg.reverse||edge.target>edge.source)&&cells[edge.source].alive&&cells[edge.target].alive&&edge.windows.some(q=>q[0]<=t&&t<q[1]);
        const [sx,sy]=pos[edge.source],[tx,ty]=pos[edge.target],direction=Math.sign(edge.target-edge.source);
        let d,lx,ly;
        if(vertical){const side=direction>0?1:-1;const guard=side>0?w-8:8;d=`M ${sx+side*31} ${sy} C ${guard} ${sy} ${guard} ${ty} ${tx+side*31} ${ty}`;lx=side>0?w-35:35;ly=(sy+ty)/2+50;}
        else {const y=sy+(direction>0?-16:16);d=`M ${sx+direction*31} ${y} Q ${(sx+tx)/2} ${y+(direction>0?-20:20)} ${tx-direction*31} ${y}`;lx=(sx+tx)/2;ly=y+(direction>0?-23:33);}
        graph.appendChild(elt('path',{d,fill:'none',stroke:active?'var(--viz-series-1)':'var(--border)','stroke-width':1.5,'marker-end':'url(#r-arrow)',opacity:active?1:.45}));
        if(active){const text=elt('text',{x:lx,y:ly,'text-anchor':'middle'},names[edge.source]+' → '+names[edge.target]);graph.appendChild(text);}
      });
      const lastCopy=run.copies.filter(c=>c[0]<=t).at(-1);
      if(lastCopy&&t-lastCopy[0]<=20){
        const [when,s,d]=lastCopy,[sx,sy]=pos[s],[tx,ty]=pos[d];
        const path=vertical?`M ${sx-35} ${sy} C 8 ${sy} 8 ${ty} ${tx-35} ${ty}`:`M ${sx} ${sy-34} Q ${(sx+tx)/2} ${sy-80} ${tx} ${ty-34}`;
        graph.appendChild(elt('path',{d:path,fill:'none',stroke:'var(--viz-series-2)','stroke-width':1.5,'stroke-dasharray':'5 4','marker-end':'url(#r-arrow)'}));
      }
      cells.forEach((cell,i)=>{
        const [x,y]=pos[i],g=elt('g',{opacity:cell.alive?1:.48});
        const recent=run.spikes.filter(s=>s[1]===i&&s[0]<=t&&t-s[0]<4).length;
        g.appendChild(elt('circle',{cx:x,cy:y,r:30,fill:recent?'color-mix(in srgb, var(--viz-series-1) 23%, transparent)':'color-mix(in srgb, var(--foreground) 4%, transparent)',stroke:'var(--border)','stroke-width':1}));
        g.appendChild(elt('text',{x,y:y+5,'text-anchor':'middle',class:'r-name'},cell.name));
        g.appendChild(elt('text',{x,y:y+55,'text-anchor':'middle'},cell.alive?['READY','FAST','SLOW'][cell.mode]:'Introduced at '+(i===1?'160':'480')));
        cell.g.forEach((value,j)=>{
          const yy=y+78+j*21,barw=vertical?Math.min(90,w/5):Math.min(70,w/12);
          g.appendChild(elt('text',{x:x-barw-25,y:yy+5,'text-anchor':'end'},'g'+j));
          g.appendChild(elt('rect',{x:x-barw-18,y:yy-5,width:barw,height:8,fill:'var(--muted)'}));
          g.appendChild(elt('rect',{x:x-barw-18,y:yy-5,width:barw*Math.min(1,value/4),height:8,fill:'var(--viz-series-1)'}));
          g.appendChild(elt('text',{x:x+barw-4,y:yy+5,'text-anchor':'end'},value.toFixed(3)));
        });
        g.appendChild(elt('text',{x,y:y+151,'text-anchor':'middle'},'b '+cell.b.toFixed(3)+' · E '+cell.E.toFixed(1)));
        graph.appendChild(g);
      });
      const cp=lastCopy?'Last copy: '+names[lastCopy[1]]+' → '+names[lastCopy[2]]+' at t='+lastCopy[0]:'No settings copy yet';
      detail.textContent=cp+' · States recorded every 2 time units.';
    }
    slider.addEventListener('input',()=>{stop();index=Number(slider.value);draw();});
    mode.addEventListener('change',()=>{stop();index=Math.min(index,recordings.runs[mode.value].samples.length-1);draw();});
    phase.addEventListener('change',()=>{stop();setTime(phases[Number(phase.value)][0]+80);});
    play.addEventListener('click',()=>{
      if(timer!==null){stop();return;}
      if(index>=recordings.runs[mode.value].samples.length-1)index=0;
      play.textContent='Pause';detail.setAttribute('aria-live','off');
      timer=setInterval(()=>{if(index>=recordings.runs[mode.value].samples.length-1){stop();return;}index++;draw();},75);
    });
    const ro=new ResizeObserver(()=>draw());ro.observe(root);
    setTime(459.9);
  })();
  </script>
</div>
